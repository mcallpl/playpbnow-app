# Login screen — forgot-password modal (open, prefill, cancel).
#
# ⚠️  DELIBERATELY STOPS BEFORE "SEND CODE".
# Tapping SEND CODE calls forgot_password.php, which fires a REAL Twilio SMS to
# whatever number is in the field. Never automate that tap. If you need to cover
# the code-entry and new-password steps, do it manually with your own phone, or
# point the flow at a staging API first.
#
#   maestro test -e APP_ID=com.mcallpl.playpbnow .maestro/login-forgot-password.yaml
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- assertVisible: "MATCH TRACKING"

# The link only exists in login mode, never in register mode.
- assertVisible: "Forgot Password"

# startForgotPassword() seeds the reset field from whatever is in the
# email/phone box, so type a number first and assert it carries over.
- tapOn: "Email or phone number"
- inputText: "9497359415"
- hideKeyboard

- tapOn: "Forgot Password"

# --- modal, step 1 of 3 ---------------------------------------------------
- assertVisible: "Reset Password"
- assertVisible: "we'll text you a 6-digit reset code"
- assertVisible: "9497359415"     # prefilled from the login field
- assertVisible: "SEND CODE"      # present, but NEVER tapped — see header

# --- cancel closes it cleanly and clears state ---------------------------
- tapOn: "Cancel"
- assertNotVisible: "Reset Password"
- assertVisible: "SIGN IN"

# reopening after a cancel must not resurrect the old reset state
- tapOn: "Forgot Password"
- assertVisible: "Reset Password"
- tapOn: "Cancel"
- assertNotVisible: "SEND CODE"
